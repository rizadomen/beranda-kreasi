<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autentikasi — Wedding Venue Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./public-style.css?v=1">
</head>
<body style="display: grid; place-items: center; min-height: 100vh; background: var(--bg); margin: 0; padding: 20px;">

  <div class="card" style="width: 100%; max-width: 420px; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
    
    <!-- Header Brand -->
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="margin: 0 auto 12px auto; width: 48px; height: 48px; display: grid; place-items: center; background: var(--primary); color: #fff; border-radius: 12px; font-weight: 800; font-size: 20px;">W</div>
      <h1 id="authTitle" style="font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px;">Masuk ke Portal Klien</h1>
      <p style="color: var(--muted); font-size: 13px;">Kelola pernikahan impianmu dengan mudah</p>
    </div>

    <!-- TOMBOL GOOGLE LOGIN -->
    <button type="button" id="btnGoogleLogin" class="btn" style="width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; font-weight: 600; cursor: pointer; border-radius: 8px; margin-bottom: 20px;">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.13 0 9.89 0 11.8s.43 3.67 1.19 5.22l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
      Lanjutkan dengan Google
    </button>

    <div style="text-align: center; margin-bottom: 20px; color: var(--muted); font-size: 12px; position: relative;">
      <span style="background: var(--surface); padding: 0 10px; position: relative; z-index: 1;">atau manual dengan email</span>
      <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); z-index: 0;"></div>
    </div>

    <!-- FORM LOGIN MANUAL -->
    <div id="loginFormView">
      <div class="field" style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px;">Email Terdaftar</label>
        <input id="loginEmail" type="email" placeholder="email@domain.com" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);">
      </div>
      <div class="field" style="margin-bottom: 8px;">
        <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px;">Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);">
      </div>
      
      <!-- LINK LUPA PASSWORD -->
      <div style="text-align: right; margin-bottom: 18px;">
        <a href="#" id="linkForgot" style="font-size: 12px; color: var(--cyan); text-decoration: none;">Lupa password?</a>
      </div>

      <button type="button" class="btn primary w-full" id="btnSubmitLogin" style="width: 100%; padding: 12px; font-weight: 600; cursor: pointer;">Masuk ke Portal</button>
      <p style="text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted);">
        Belum punya akun? <a href="#" id="switchToRegister" style="color: var(--cyan); font-weight: 600; text-decoration: none;">Daftar baru</a>
      </p>
    </div>

    <!-- FORM REGISTER MANUAL -->
    <div id="registerFormView" class="hidden">
      <div class="field" style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px;">Nama Lengkap / Pasangan</label>
        <input id="regName" type="text" placeholder="Nama Anda" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);">
      </div>
      <div class="field" style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px;">Email Aktif</label>
        <input id="regEmail" type="email" placeholder="email@domain.com" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);">
      </div>
      <div class="field" style="margin-bottom: 18px;">
        <label style="font-size: 12px; font-weight: 600; display: block; margin-bottom: 6px;">Buat Password</label>
        <input id="regPassword" type="password" placeholder="Minimal 6 karakter" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);">
      </div>
      <button type="button" class="btn primary w-full" id="btnSubmitRegister" style="width: 100%; padding: 12px; font-weight: 600; cursor: pointer;">Buat Akun Sekarang</button>
      <p style="text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted);">
        Sudah punya akun? <a href="#" id="switchToLogin" style="color: var(--cyan); font-weight: 600; text-decoration: none;">Masuk di sini</a>
      </p>
    </div>

    <div style="text-align: center; margin-top: 24px;">
      <a href="index.html" style="color: var(--muted); font-size: 12px; text-decoration: none;">← Kembali ke Beranda</a>
    </div>

  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- SCRIPT LOGIKA HALAMAN AUTH -->
  <script type="module">
    import { loginWithGoogle, checkAuthStatus } from './auth-app.js';

    // Cek jika user sudah login, langsung lempar ke client.html
    checkAuthStatus(false);

    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxsyukFGT1DwBMZz80hNeHKpMyR0erEL-08t1Wz4HP8p2zQFuHecw7FU_bLL5ZD18Ts/exec';
    const $ = (id) => document.getElementById(id);

    function toast(msg, isErr = false) {
      const t = $('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = 'toast' + (isErr ? ' err' : '');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    async function api(action, payload = {}) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, payload })
      });
      if (!res.ok) throw new Error('HTTP Error: ' + res.status);
      return await res.json();
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Tangkap parameter URL untuk switch form (login / register)
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode');
      if (mode === 'register') {
        $('authTitle').textContent = 'Daftar Akun Baru';
        $('loginFormView').classList.add('hidden');
        $('registerFormView').classList.remove('hidden');
      }

      // Toggle antar form
      $('switchToRegister').addEventListener('click', (e) => {
        e.preventDefault();
        $('authTitle').textContent = 'Daftar Akun Baru';
        $('loginFormView').classList.add('hidden');
        $('registerFormView').classList.remove('hidden');
      });

      $('switchToLogin').addEventListener('click', (e) => {
        e.preventDefault();
        $('authTitle').textContent = 'Masuk ke Portal Klien';
        $('registerFormView').classList.add('hidden');
        $('loginFormView').classList.remove('hidden');
      });

      // Tombol Google Login
      $('btnGoogleLogin').addEventListener('click', () => {
        $('btnGoogleLogin').textContent = "Menghubungkan...";
        $('btnGoogleLogin').disabled = true;
        loginWithGoogle();
      });

      // Submit Register Manual
      $('btnSubmitRegister').addEventListener('click', async () => {
        const btn = $('btnSubmitRegister');
        const name = $('regName').value.trim();
        const email = $('regEmail').value.trim();
        const password = $('regPassword').value.trim();

        if (!name || !email || !password) return toast('Semua field wajib diisi!', true);
        if (password.length < 6) return toast('Password minimal 6 karakter!', true);

        btn.textContent = 'Memproses...';
        btn.disabled = true;

        try {
          const res = await api('createClient', { name, email, password });
          if (res.status !== 'BERHASIL') throw new Error(res.message);
          toast('Akun berhasil dibuat! Silakan masuk.');
          $('regName').value = '';
          $('regEmail').value = '';
          $('regPassword').value = '';
          $('loginEmail').value = email;
          $('registerFormView').classList.add('hidden');
          $('loginFormView').classList.remove('hidden');
          $('authTitle').textContent = 'Masuk ke Portal Klien';
        } catch (err) {
          toast(err.message, true);
        } finally {
          btn.textContent = 'Buat Akun Sekarang';
          btn.disabled = false;
        }
      });

      // Submit Login Manual
      $('btnSubmitLogin').addEventListener('click', async () => {
        const btn = $('btnSubmitLogin');
        const email = $('loginEmail').value.trim();
        const password = $('loginPassword').value.trim();

        if (!email || !password) return toast('Email dan password wajib diisi!', true);

        btn.textContent = 'Memeriksa...';
        btn.disabled = true;

        try {
          const res = await api('clientLogin', { email, password });
          if (res.status !== 'BERHASIL') throw new Error(res.message || 'Login gagal.');

          localStorage.setItem("wvh_client", JSON.stringify(res.client));
          localStorage.setItem("wvh_is_logged_in", "true");
          toast('Login berhasil! Membuka portal...');
          setTimeout(() => {
            window.location.href = './client.html';
          }, 800);
        } catch (err) {
          toast(err.message, true);
          btn.textContent = 'Masuk ke Portal Klien';
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
