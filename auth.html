<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk / Daftar - Wedding Venue Hub</title>
  <link rel="stylesheet" href="public-style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div style="min-height: 100vh; display: grid; place-items: center; padding: 20px;">
    <div class="card" style="width: 100%; max-width: 420px; padding: 32px;">
      
      <!-- Brand Header -->
      <div style="text-align: center; margin-bottom: 28px;">
        <div class="brand-icon" style="margin: 0 auto 12px auto; width: 48px; height: 48px; font-size: 22px;">W</div>
        <h1 style="font-size: 22px; font-weight: 800; color: var(--text);">Wedding Venue Hub</h1>
        <p style="color: var(--muted); font-size: 13px; margin-top: 4px;">Masuk atau buat akun untuk kelola pernikahan impianmu</p>
      </div>

      <!-- Tombol Google Sign-In -->
      <button type="button" id="btnGoogleLogin" class="btn" style="width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.13 0 9.89 0 11.8s.43 3.67 1.19 5.22l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        Lanjutkan dengan Google
      </button>

      <div style="text-align: center; margin: 20px 0; color: var(--muted); font-size: 12px; position: relative;">
        <span style="background: var(--surface); padding: 0 10px; position: relative; z-index: 1;">atau gunakan email</span>
        <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); z-index: 0;"></div>
      </div>

      <!-- Form Manual (Opsional) -->
      <form id="authForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="emailInput" placeholder="nama@email.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="passwordInput" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn primary" style="width: 100%; margin-top: 6px;">Masuk / Daftar</button>
      </form>

      <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" style="color: var(--muted); font-size: 12px; text-decoration: none;">← Kembali ke Beranda</a>
      </div>

    </div>
  </div>

  <!-- Toast Notifikasi -->
  <div id="toast" class="toast hidden"></div>

  <!-- Script Auth Firebase -->
  <script type="module" src="auth-app.js"></script>
</body>
</html>
