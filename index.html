<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda Kreasi — Wedding Venue Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <header class="portal-top">
    <div style="display:flex; justify-content:space-between; align-items:center; padding: 16px 0;">
      <div class="brand">
        <div class="mark">BK</div>
        <div>
          <strong>Beranda Kreasi</strong>
          <small>Wedding Venue Hub</small>
        </div>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button">
        <span id="themeToggleIcon">☀</span> <span id="themeToggleLabel">Ganti Tema</span>
      </button>
    </div>
  </header>

  <main>
    <div class="home-welcome" style="margin-bottom: 24px;">
      <div class="eyebrow">KATALOG VENUE RESMI</div>
      <h1>Temukan Venue Pernikahan Impianmu</h1>
      <p class="muted">Pilihan venue terbaik dan eksklusif dari Beranda Kreasi.</p>
    </div>

    <div class="card">
      <div id="venueLoading" class="state">Memuat daftar venue dari sistem...</div>
      <div id="venueError" class="state hidden">Gagal memuat daftar venue. Periksa koneksi backend.</div>
      <div id="venueList" class="venue-grid hidden"></div>
    </div>
  </main>

  <footer class="footer">Website Resmi Beranda Kreasi · Wedding Venue Hub</footer>
</div>

<script src="app.js"></script>
</body>
</html>
