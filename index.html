<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Venue Hub - Cari Venue Pernikahan Impian</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER / NAVBAR -->
  <header class="site-header">
    <div class="container header-container">
      <div class="logo">💍 Wedding Venue Hub</div>
      <div class="header-actions">
        <button id="themeToggle" class="btn-theme" title="Ubah Tema"><span id="themeToggleIcon">☀</span></button>
      </div>
    </div>
  </header>

  <!-- HERO & FILTER SECTION -->
  <main class="container main-content">
    <section class="hero-section">
      <h1>Temukan Venue Pernikahan Impian Anda</h1>
      <p>Jelajahi berbagai pilihan venue terbaik dengan mudah dan langsung terhubung ke pengelola.</p>
      
      <!-- KOTAK & TOMBOL FILTER -->
      <div class="filter-box">
        <input type="text" id="searchQuery" placeholder="Cari nama venue atau kota..." class="filter-input">
        <select id="filterCity" class="filter-select">
          <option value="">Semua Kota</option>
        </select>
        <select id="filterJenis" class="filter-select">
          <option value="">Semua Jenis Venue</option>
          <option value="Indoor">Indoor</option>
          <option value="Outdoor">Outdoor</option>
          <option value="Semi-Outdoor">Semi-Outdoor</option>
          <option value="Hotel">Hotel</option>
          <option value="Function room facility">Function Room</option>
          <option value="Wedding Hall">Wedding Hall</option>
          <option value="Convention center">Convention Center</option>
          <option value="Event venue">Event Venue</option>
        </select>
      </div>
    </section>

    <!-- LOADING & ERROR STATE -->
    <div id="venueLoading" class="loading-state">Memuat daftar venue dari database...</div>
    <div id="venueError" class="error-state hidden">Gagal memuat daftar venue. Periksa koneksi backend.</div>

    <!-- DAFTAR KATALOG VENUE -->
    <section id="venueList" class="venue-grid hidden">
      <!-- Kartu venue akan dimuat otomatis oleh app.js di sini -->
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Wedding Venue Hub. All rights reserved.</p>
    </div>
  </footer>

  <!-- SCRIPT UTAMA -->
  <script src="app.js"></script>
</body>
</html>
